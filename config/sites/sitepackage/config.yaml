# Update base URL: for DDEV use https://<project-name>.ddev.site/
# For production set the real domain below
base: 'https://your-project.ddev.site/'
baseVariants: []
dependencies:
  - conn/sitepackage
  - conn/elements
  - conn/base
  - typo3/seo-sitemap
  - clickstorm/cs-seo
  - baschte/content-animations
  - baschte/content-animations-fluid-styles-content
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=2'
languages:
  -
    title: Deutsch
    enabled: true
    languageId: 0
    base: /
    locale: de_AT.utf8
    navigationTitle: Deutsch
    flag: at
    hreflang: ''
    websiteTitle: ''
rootPageId: 1
websiteTitle: 'My TYPO3 Project'
routeEnhancers:
  PageTypeSuffix:
    type: PageType
    default: /
    index: /
    map:
      /: 0
      sitemap.xml: 1533906435
  Sitemap:
    type: Simple
    routePath: 'sitemap/{sitemap}'
    aspects:
      sitemap:
        type: StaticValueMapper
        map:
          pages: pages

routes:
  -
    route: robots.txt
    type: staticText
    content: "User-agent: *\r\nDisallow: /fileadmin/_temp_/\r\nDisallow: /t3lib/\r\nDisallow: /typo3/\r\nDisallow: /typo3_src/\r\nDisallow: /typo3conf/\r\nDisallow: /clear.gif\r\nAllow: /typo3/sysext/frontend/Resources/Public/*\r\nAllow: /typo3conf/ext/news/Resources/Public/*\r\n\r\nSitemap: https://your-project.ddev.site/sitemap.xml\r\n"

