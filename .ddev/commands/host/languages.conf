# Languages offered by `ddev setup-project`'s language selection prompt.
#
# One language per line: code|title|locale|flag|hreflang
#   code     - ISO 639-1 code, used as the URL path segment for non-default
#              languages (e.g. "en" -> /en/) and to detect duplicate picks
#   title    - shown in the menu, and used for the site config's
#              title/navigationTitle
#   locale   - PHP/TYPO3 locale, e.g. de_AT.utf8
#   flag     - icon name from typo3/cms-core's Resources/Public/Icons/Flags/
#   hreflang - hreflang value for the site config
#
# Lines starting with # and blank lines are ignored. Order here is the
# order shown in the menu (not the order projects end up with - that's
# whatever the user picks, first pick = default language).

de|Deutsch|de_AT.utf8|at|de-AT
en|English|en_US.utf8|gb|en
it|Italiano|it_IT.utf8|it|it
fr|Français|fr_FR.utf8|fr|fr
hr|Hrvatski|hr_HR.utf8|hr|hr
sl|Slovenščina|sl_SI.utf8|si|sl
hu|Magyar|hu_HU.utf8|hu|hu
cs|Čeština|cs_CZ.utf8|cz|cs
sk|Slovenčina|sk_SK.utf8|sk|sk
es|Español|es_ES.utf8|es|es
